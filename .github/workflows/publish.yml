name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string
      confirmation:
        description: Enter the same release tag to confirm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.release_tag == inputs.confirmation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-release
    env:
      GH_TOKEN: ${{ github.token }}
      PI_RELEASE_ENVIRONMENT: npm-release
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate release input
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.20.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check repository
        run: npm run check
      - name: Publish release
        run: npm run publish-release -- "$RELEASE_TAG" --github-actions
