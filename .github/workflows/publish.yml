name: Publish npm package

on:
  push:
    tags:
      - "pi-extensions@*"
      - "pi-notify@*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - root
          - notify

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-release
    env:
      PI_RELEASE_ENVIRONMENT: npm-release
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Resolve release selector
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            case "$REF_NAME" in
              pi-extensions@*) selector=root; manifest=package.json ;;
              pi-notify@*) selector=notify; manifest=packages/notify/package.json ;;
              *) echo "Unsupported release tag: $REF_NAME" >&2; exit 1 ;;
            esac
            tag_version="${REF_NAME##*@}"
            manifest_version="$(node -p "require('./$manifest').version")"
            [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$tag_version" == "$manifest_version" ]] || {
              echo "Tag version $tag_version does not match $manifest version $manifest_version" >&2
              exit 1
            }
          else
            [[ "$REF" == "refs/heads/main" ]] || {
              echo "Manual publishing must run from main" >&2
              exit 1
            }
            selector="$INPUT_PACKAGE"
            [[ "$selector" == "root" || "$selector" == "notify" ]]
          fi
          echo "selector=$selector" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.20.0
          cache: npm
      - name: Set up npm with trusted publishing support
        run: npm install --global npm@11.12.1
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check repository
        run: npm run check
      - name: Publish selected package
        env:
          PI_RELEASE_SELECTOR: ${{ steps.release.outputs.selector }}
        run: npm run publish-release -- "$PI_RELEASE_SELECTOR" --github-actions
